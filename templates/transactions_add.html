{% extends "app_base.html" %}
{% block title %}Add Transaction{% endblock %}
{% block content %}
<h2>Add a transaction manually</h2>
<form method="POST" class="stacked-form">
    <div class="field">
        <label>Amount (₹)</label>
        <input type="number" step="0.01" name="amount" required>
    </div>
    <div class="field">
        <label>Type</label>
        <select name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
        </select>
    </div>
    <div class="field">
        <label>Merchant / Description</label>
        <input type="text" name="merchant" placeholder="e.g. Swiggy, Salary, Uber">
    </div>
    <button type="submit" class="btn-primary" style="width:auto; padding:10px 28px;">Add</button>
</form>
{% endblock %}
